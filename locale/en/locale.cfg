[mod-name]
my-better-robots-config=My Better Robots Config

[mod-description]
my-better-robots-config=Easy changeable robot and roboports settings. \n - Roboports Charging Number and Radius Places \n - Worker and Logic Robots Flying Speed \n - Worker and Logic Robots Energy Capacity (for longer Flying Time)

[mod-setting-name]
fast-worker-robot-speed=Worker robot speed
worker-robot-battery-modifier=Worker robot battery
roboport-charging-spots-count=Roboport charging spots count
roboport-charging-spots-radius=Roboport charging spots radius

[mod-setting-description]
fast-worker-robot-speed=Target speed in tiles/second for worker robots (logistic and construction). Default: 5.0.
worker-robot-battery-modifier=Worker robot battery capacity multiplier (e.g. 4.0 = 4x capacity). Default: 4.0.
roboport-charging-spots-count=Number of simultaneous charging spots on the roboport (arranged in a circle). Default: 16.
roboport-charging-spots-radius=Distance of charging spots from the roboport center (in tiles). Default: 1.5.
